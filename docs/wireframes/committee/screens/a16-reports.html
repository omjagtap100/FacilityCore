</div>
<span class="font-title-md text-title-md text-on-surface">March 2026</span>
</div>
<span class="font-label-caps text-label-caps text-secondary uppercase">Current</span>
</div>
<div class="w-full h-[1px] bg-outline-variant/40 ml-margin"></div>
<div class="w-full px-margin py-3.5 flex items-center justify-between cursor-pointer active:bg-surface-container transition-colors" id="period-year" onclick="selectPeriod('year')">
<div class="flex items-center gap-3">
<div class="w-4 h-4 rounded-full border border-secondary flex items-center justify-center" id="dot-year">
<div class="w-2 h-2 rounded-full bg-transparent"></div>
</div>
<span class="font-title-md text-title-md text-secondary">April 2025 – March 2026</span>
</div>
<span class="font-label-caps text-label-caps text-secondary uppercase">FY 25–26</span>

<div class="w-full h-[1px] bg-outline-variant/40 ml-margin"></div>

<div class="w-full h-[1px] bg-outline-variant/40 ml-margin"></div>

</div>

<script>
  const data = {
    month: {
      collected: '₹3,20,000',
      pending: '₹1,10,000',
      overdue: '₹42,500',
      late: '₹1,850',
      sinking: '₹12,000',
      repair: '₹12,000'
    },
    year: {
      collected: '₹38,40,000',
      pending: '₹1,10,000',
      overdue: '₹42,500',
      late: '₹22,200',
      sinking: '₹1,44,000',
      repair: '₹1,44,000'
    }
  };

  function selectPeriod(period) {
    const isMonth = period === 'month';
    const dotMonth = document.getElementById('dot-month');
    const dotYear = document.getElementById('dot-year');
    const textMonth = document.querySelector('#period-month span.font-title-md');
    const textYear = document.querySelector('#period-year span.font-title-md');

    if (isMonth) {
      dotMonth.className = 'w-4 h-4 rounded-full border border-primary flex items-center justify-center';
      dotMonth.innerHTML = '<div class="w-2 h-2 rounded-full bg-primary"></div>';
      dotYear.className = 'w-4 h-4 rounded-full border border-secondary flex items-center justify-center';
      dotYear.innerHTML = '<div class="w-2 h-2 rounded-full bg-transparent"></div>';
      textMonth.classList.remove('text-secondary');
      textMonth.classList.add('text-on-surface');
      textYear.classList.remove('text-on-surface');
      textYear.classList.add('text-secondary');
    } else {
      dotYear.className = 'w-4 h-4 rounded-full border border-primary flex items-center justify-center';
      dotYear.innerHTML = '<div class="w-2 h-2 rounded-full bg-primary"></div>';
      dotMonth.className = 'w-4 h-4 rounded-full border border-secondary flex items-center justify-center';
      dotMonth.innerHTML = '<div class="w-2 h-2 rounded-full bg-transparent"></div>';
      textYear.classList.remove('text-secondary');
      textYear.classList.add('text-on-surface');
      textMonth.classList.remove('text-on-surface');
      textMonth.classList.add('text-secondary');
    }

    const currentData = data[period];
    document.getElementById('val-collected').innerText = currentData.collected;
    document.getElementById('val-pending').innerText = currentData.pending;
    document.getElementById('val-overdue').innerText = currentData.overdue;
    document.getElementById('val-late').innerText = currentData.late;
    document.getElementById('val-sinking').innerText = currentData.sinking;
    document.getElementById('val-repair').innerText = currentData.repair;
  }

  function triggerDownload() {
    const btn = document.getElementById('download-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>Exported to Downloads</span>';
    setTimeout(() => {
      btn.innerHTML = originalText;
    }, 2200);
  }
</script></main></div></body></html>
