<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-bright": "#faf9f6", "secondary": "#625e57", "on-secondary-fixed": "#1e1b16", "on-secondary": "#ffffff", "tertiary-fixed-dim": "#8cd6a8", "inverse-on-surface": "#f2f1ee", "secondary-fixed-dim": "#ccc5bd", "background": "#faf9f6", "on-tertiary-fixed": "#002110", "surface-container-high": "#e9e8e5", "on-surface": "#1b1c1a", "on-error": "#ffffff", "on-tertiary": "#ffffff", "error": "#ba1a1a", "surface-container": "#efeeeb", "on-primary-container": "#868380", "on-primary-fixed": "#1c1b19", "tertiary": "#000000", "primary": "#000000", "primary-fixed-dim": "#cac6c2", "inverse-primary": "#cac6c2", "surface-container-low": "#f4f3f0", "on-secondary-container": "#67625b", "surface-dim": "#dbdad7", "surface-tint": "#605e5b", "on-primary": "#ffffff", "error-container": "#ffdad6", "outline": "#7a776f", "on-error-container": "#93000a", "tertiary-container": "#002110", "secondary-fixed": "#e9e1d9", "on-background": "#1b1c1a", "surface": "#faf9f6", "outline-variant": "#cbc6bd", "surface-container-highest": "#e3e2df", "on-primary-fixed-variant": "#484644", "surface-container-lowest": "#ffffff", "primary-fixed": "#e6e2de", "on-tertiary-fixed-variant": "#005230", "primary-container": "#1c1b19", "on-secondary-fixed-variant": "#4a4640", "tertiary-fixed": "#a7f3c3", "on-surface-variant": "#494740", "on-tertiary-container": "#499268", "surface-variant": "#e3e2df", "inverse-surface": "#2f312f", "secondary-container": "#e6ded6" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.5rem", "space-xl": "2.5rem", "space-md": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "headline-lg": ["Inter"], "label-nav": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "title-md": ["Inter"], "label-caps": ["Inter"], "headline-sm": ["Inter"], "amount-display": ["Inter"] }, "fontSize": { "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-nav": ["11px", { "lineHeight": "14px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "amount-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "600" }] } } } }</script><style>

  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary selection:text-on-primary"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-14 px-margin max-w-[480px] mx-auto flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="text-title-md font-title-md tracking-tight text-on-surface">Poll</h1></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col flex-1 relative w-full max-w-[480px] mx-auto px-margin pt-14 pb-safe bg-surface"><div class="flex flex-col w-full text-on-surface">
<div class="flex flex-col pt-space-md">
<div class="flex items-center gap-space-xs mb-space-sm">
<span class="font-label-caps text-label-caps text-secondary tracking-wider uppercase">Resolution No. 24/03</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface tracking-tight mb-space-xs">
      Approve the lift AMC for next year?
    </h2>
<p class="font-body-sm text-body-sm text-secondary">
      Closes 20 March · one vote for B-1204.
    </p>
</div>
<div class="mt-space-xl flex flex-col">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider mb-space-sm">
      Cast Flat Ballot
    </span>
<div class="flex flex-col bg-surface-container-high/40 rounded-lg overflow-hidden">
<button class="w-full h-14 px-space-md flex items-center justify-between text-left transition-colors bg-primary text-on-primary" id="opt-yes" onclick="selectOption('yes')" type="button">
<span class="font-title-md text-title-md">Yes</span>
<span class="material-symbols-outlined text-[20px] text-on-primary" id="indicator-yes">check</span>
</button>
<div class="h-[1px] w-full bg-outline-variant/30"></div>
<button class="w-full h-14 px-space-md flex items-center justify-between text-left transition-colors bg-surface-container-lowest text-on-surface" id="opt-no" onclick="selectOption('no')" type="button">
<span class="font-title-md text-title-md">No</span>
<span class="material-symbols-outlined text-[20px] text-transparent" id="indicator-no">check</span>
</button>
</div>
</div>
<div class="mt-space-lg flex flex-col">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-title-md text-title-md flex items-center justify-center active:opacity-85 transition-opacity" id="submit-vote-btn" onclick="recordVote()" type="button">
      Vote
    </button>
</div>
<div class="mt-space-xl pt-space-md border-t border-outline-variant/40 flex flex-col gap-space-xs">
<div class="flex items-baseline justify-between">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Tallied Register</span>
<span class="font-body-sm text-body-sm text-secondary">83 flats recorded</span>
</div>
<p class="font-body-md text-body-md text-on-surface" id="tally-summary">
      You voted Yes · 62 yes, 21 no.
    </p>
<p class="font-body-sm text-body-sm text-secondary mt-space-xs">
      Quorum threshold: 54 flats. Ballot verified under Maharashtra Co-operative Societies Bye-law 110.
    </p>
</div>
<div class="mt-space-xl flex justify-center pb-space-lg">
<button class="font-body-md text-body-md text-on-surface hover:underline active:opacity-75" type="button">
      View Society Meeting Notice
    </button>
</div>
</div>
<script>
  let currentSelection = 'yes';
  let votedOption = 'Yes';
  let yesCount = 62;
  let noCount = 21;

  function selectOption(option) {
    currentSelection = option;
    const btnYes = document.getElementById('opt-yes');
    const btnNo = document.getElementById('opt-no');
    const indYes = document.getElementById('indicator-yes');
    const indNo = document.getElementById('indicator-no');

    if (option === 'yes') {
      btnYes.className = 'w-full h-14 px-space-md flex items-center justify-between text-left transition-colors bg-primary text-on-primary';
      indYes.className = 'material-symbols-outlined text-[20px] text-on-primary';
      btnNo.className = 'w-full h-14 px-space-md flex items-center justify-between text-left transition-colors bg-surface-container-lowest text-on-surface';
      indNo.className = 'material-symbols-outlined text-[20px] text-transparent';
    } else {
      btnNo.className = 'w-full h-14 px-space-md flex items-center justify-between text-left transition-colors bg-primary text-on-primary';
      indNo.className = 'material-symbols-outlined text-[20px] text-on-primary';
      btnYes.className = 'w-full h-14 px-space-md flex items-center justify-between text-left transition-colors bg-surface-container-lowest text-on-surface';
      indYes.className = 'material-symbols-outlined text-[20px] text-transparent';
    }
  }

  function recordVote() {
    votedOption = currentSelection === 'yes' ? 'Yes' : 'No';
    const summary = document.getElementById('tally-summary');
    const submitBtn = document.getElementById('submit-vote-btn');
    
    summary.textContent = 'You voted ' + votedOption + ' · ' + yesCount + ' yes, ' + noCount + ' no.';
    submitBtn.textContent = 'Vote Recorded';
    submitBtn.classList.add('opacity-50');
    submitBtn.disabled = true;
  }
</script></main></body></html>
