<script>
  function selectLanguage(element, code) {
    const options = document.querySelectorAll('.lang-option');
    options.forEach(opt => {
      opt.setAttribute('aria-checked', 'false');
      const ind = opt.querySelector('.indicator');
      if (ind) {
        ind.classList.remove('opacity-100');
        ind.classList.add('opacity-0');
      }
    });

    element.setAttribute('aria-checked', 'true');
    const activeIndicator = element.querySelector('.indicator');
    if (activeIndicator) {
      activeIndicator.classList.remove('opacity-0');
      activeIndicator.classList.add('opacity-100');
    }

    try {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(15);
      }
    } catch (e) {}
  }
</script></main></body></html>
