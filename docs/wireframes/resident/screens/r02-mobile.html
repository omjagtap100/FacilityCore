<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "primary-fixed-dim": "#cac6c2", "on-tertiary": "#ffffff", "surface-container": "#efeeeb", "error-container": "#ffdad6", "surface-container-high": "#e9e8e5", "surface-container-lowest": "#ffffff", "secondary": "#625e57", "on-secondary-fixed-variant": "#4a4640", "inverse-surface": "#2f312f", "outline": "#7a776f", "on-tertiary-fixed": "#002110", "surface": "#faf9f6", "tertiary-fixed": "#a7f3c3", "inverse-primary": "#cac6c2", "on-secondary": "#ffffff", "inverse-on-surface": "#f2f1ee", "on-error-container": "#93000a", "surface-bright": "#faf9f6", "primary": "#000000", "on-tertiary-fixed-variant": "#005230", "surface-container-highest": "#e3e2df", "secondary-fixed-dim": "#ccc5bd", "error": "#ba1a1a", "outline-variant": "#cbc6bd", "tertiary-fixed-dim": "#8cd6a8", "on-tertiary-container": "#499268", "tertiary-container": "#002110", "background": "#faf9f6", "on-primary-fixed": "#1c1b19", "tertiary": "#000000", "on-secondary-container": "#67625b", "primary-container": "#1c1b19", "on-secondary-fixed": "#1e1b16", "on-primary": "#ffffff", "secondary-fixed": "#e9e1d9", "surface-container-low": "#f4f3f0", "on-background": "#1b1c1a", "primary-fixed": "#e6e2de", "surface-variant": "#e3e2df", "secondary-container": "#e6ded6", "on-error": "#ffffff", "on-surface-variant": "#494740", "on-primary-fixed-variant": "#484644", "surface-tint": "#605e5b", "on-primary-container": "#868380", "surface-dim": "#dbdad7", "on-surface": "#1b1c1a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xs": "0.25rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "space-md": "1rem", "gutter": "1rem", "margin": "1.5rem", "space-xl": "2.5rem" }, "fontFamily": { "headline-sm": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-caps": ["Inter"], "amount-display": ["Inter"], "headline-lg": ["Inter"], "body-sm": ["Inter"], "title-md": ["Inter"], "label-nav": ["Inter"] }, "fontSize": { "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "600" }], "amount-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "600" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "label-nav": ["11px", { "lineHeight": "14px", "fontWeight": "500" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#faf9f6;color:#1b1c1a;font-family:'Inter',sans-serif;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><div class="w-full pt-safe"><div class="h-6 px-margin flex items-center justify-between text-on-surface"><span class="font-label-caps text-label-caps tracking-normal font-semibold">09:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div></div><main class="flex flex-col relative w-full px-margin pb-safe bg-surface flex-1"><div class="flex flex-col w-full max-w-[440px] mx-auto">
<div class="pt-8 pb-8 flex flex-col">
<div class="flex items-center justify-between pb-6">
<button aria-label="Go back" class="p-1 -ml-1 text-on-surface hover:text-primary transition-opacity focus:outline-none" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<span class="font-label-caps text-label-caps text-secondary tracking-wider uppercase">Step 1 of 2</span>
</div>
<h1 class="font-headline-lg text-[28px] leading-[34px] font-normal text-primary tracking-tight">
      Sign in.
    </h1>
<p class="font-body-md text-[15px] leading-[22px] text-secondary mt-2">
      Use the mobile number registered for your flat.
    </p>
</div>
<form class="flex flex-col w-full" id="signin-form" onsubmit="handleSendCode(event)">
<div class="flex flex-col mb-8">
<label class="font-label-caps text-[13px] leading-[18px] uppercase tracking-wider text-secondary font-semibold mb-2" for="mobile-input">
        Mobile number
      </label>
<div class="flex items-center h-12 w-full px-4 rounded-lg bg-surface-container-lowest border border-outline-variant focus-within:border-primary transition-colors" id="input-container">
<span class="font-title-md text-[15px] text-on-background font-medium pr-3 mr-3 border-r border-outline-variant select-none">
          +91
        </span>
<input autocomplete="tel-national" class="w-full h-full bg-transparent text-primary font-body-lg text-[15px] placeholder:text-secondary focus:outline-none tracking-normal" id="mobile-input" inputmode="numeric" maxlength="10" oninput="validateInput(this)" pattern="[0-9]{10}" placeholder="98******10" required="" type="tel"/>
<button aria-label="Clear field" class="hidden text-secondary hover:text-primary focus:outline-none pl-2" id="clear-btn" onclick="clearMobile()" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-2" id="helper-text">
        A 6-digit confirmation code will be sent via SMS.
      </p>
</div>
<div class="flex flex-col w-full">
<button class="w-full h-12 bg-primary text-surface rounded-lg font-title-md text-[15px] font-semibold transition-opacity active:opacity-85 disabled:opacity-35 disabled:cursor-not-allowed flex items-center justify-center" disabled="" id="submit-btn" type="submit">
<span>Send code</span>
</button>
<div class="mt-8 pt-6 border-t border-outline-variant flex flex-col items-center justify-center text-center">
<span class="font-label-caps text-label-caps uppercase text-secondary tracking-wider mb-2">Need society office support?</span>
<a class="font-body-sm text-body-sm font-medium text-primary underline underline-offset-4 active:opacity-75" href="tel:02220001000">
          Call Society Administrator (Flat Records)
        </a>
</div>
</div>
</form>
<script>
    function validateInput(input) {
      input.value = input.value.replace(/[^0-9]/g, '');
      const clearBtn = document.getElementById('clear-btn');
      const submitBtn = document.getElementById('submit-btn');

      if (input.value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      if (input.value.length === 10) {
        submitBtn.removeAttribute('disabled');
      } else {
        submitBtn.setAttribute('disabled', 'true');
      }
    }

    function clearMobile() {
      const input = document.getElementById('mobile-input');
      input.value = '';
      validateInput(input);
      input.focus();
    }

    function handleSendCode(e) {
      e.preventDefault();
      const input = document.getElementById('mobile-input');
      const submitBtn = document.getElementById('submit-btn');
      if (input.value.length === 10) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="font-title-md text-[15px]">Sending SMS...</span>';
        setTimeout(() => {
          submitBtn.innerHTML = '<span class="font-title-md text-[15px]">Code Sent</span>';
        }, 900);
      }
    }
  </script>
</div></main></body></html>
