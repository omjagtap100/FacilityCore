<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-bright": "#faf9f6", "secondary": "#625e57", "on-secondary-fixed": "#1e1b16", "on-secondary": "#ffffff", "tertiary-fixed-dim": "#8cd6a8", "inverse-on-surface": "#f2f1ee", "secondary-fixed-dim": "#ccc5bd", "background": "#faf9f6", "on-tertiary-fixed": "#002110", "surface-container-high": "#e9e8e5", "on-surface": "#1b1c1a", "on-error": "#ffffff", "on-tertiary": "#ffffff", "error": "#ba1a1a", "surface-container": "#efeeeb", "on-primary-container": "#868380", "on-primary-fixed": "#1c1b19", "tertiary": "#000000", "primary": "#000000", "primary-fixed-dim": "#cac6c2", "inverse-primary": "#cac6c2", "surface-container-low": "#f4f3f0", "on-secondary-container": "#67625b", "surface-dim": "#dbdad7", "surface-tint": "#605e5b", "on-primary": "#ffffff", "error-container": "#ffdad6", "outline": "#7a776f", "on-error-container": "#93000a", "tertiary-container": "#002110", "secondary-fixed": "#e9e1d9", "on-background": "#1b1c1a", "surface": "#faf9f6", "outline-variant": "#cbc6bd", "surface-container-highest": "#e3e2df", "on-primary-fixed-variant": "#484644", "surface-container-lowest": "#ffffff", "primary-fixed": "#e6e2de", "on-tertiary-fixed-variant": "#005230", "primary-container": "#1c1b19", "on-secondary-fixed-variant": "#4a4640", "tertiary-fixed": "#a7f3c3", "on-surface-variant": "#494740", "on-tertiary-container": "#499268", "surface-variant": "#e3e2df", "inverse-surface": "#2f312f", "secondary-container": "#e6ded6" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.5rem", "space-xl": "2.5rem", "space-md": "1rem", "space-sm": "0.5rem" }, "fontFamily": { "headline-lg": ["Inter"], "label-nav": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "title-md": ["Inter"], "label-caps": ["Inter"], "headline-sm": ["Inter"], "amount-display": ["Inter"] }, "fontSize": { "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-nav": ["11px", { "lineHeight": "14px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "amount-display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "600" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary selection:text-on-primary"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-14 px-margin max-w-[480px] mx-auto flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="text-title-md font-title-md tracking-tight text-on-surface">Emergency</h1></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col flex-1 relative w-full max-w-[480px] mx-auto px-margin pt-14 pb-safe bg-surface"><div class="flex flex-col w-full">
<!-- Unit Identifier / Context -->
<div class="flex flex-col pt-space-md pb-space-lg">
<span class="text-body-sm font-body-sm text-secondary uppercase tracking-wider">Unit B-1204 · West Wing</span>
<p class="text-body-md font-body-md text-on-surface mt-space-xs">
      Select emergency protocol to broadcast immediate society alert.
    </p>
</div>
<!-- Flat Selection List with Hairline Dividers -->
<div aria-label="Emergency category" class="w-full border-t border-b border-outline-variant" role="radiogroup">
<!-- Option 1: Medical -->
<label class="flex items-center justify-between h-16 px-space-xs cursor-pointer select-none transition-colors" onclick="selectEmergency('medical')">
<div class="flex items-center gap-space-md">
<div class="w-[18px] h-[18px] rounded-full border border-secondary flex items-center justify-center" id="radio-medical">
<div class="w-2 h-2 rounded-full bg-transparent"></div>
</div>
<span class="text-title-md font-title-md text-error tracking-tight">Medical</span>
</div>
<span class="text-label-caps font-label-caps text-secondary uppercase">Code Amber</span>
</label>
<div class="w-full h-[1px] bg-outline-variant"></div>
<!-- Option 2: Fire -->
<label class="flex items-center justify-between h-16 px-space-xs cursor-pointer select-none transition-colors" onclick="selectEmergency('fire')">
<div class="flex items-center gap-space-md">
<div class="w-[18px] h-[18px] rounded-full border border-secondary flex items-center justify-center" id="radio-fire">
<div class="w-2 h-2 rounded-full bg-transparent"></div>
</div>
<span class="text-title-md font-title-md text-error tracking-tight">Fire</span>
</div>
<span class="text-label-caps font-label-caps text-secondary uppercase">Code Red</span>
</label>
<div class="w-full h-[1px] bg-outline-variant"></div>
<!-- Option 3: Security (Selected by default) -->
<label class="flex items-center justify-between h-16 px-space-xs cursor-pointer select-none transition-colors" onclick="selectEmergency('security')">
<div class="flex items-center gap-space-md">
<div class="w-[18px] h-[18px] rounded-full border border-primary flex items-center justify-center" id="radio-security">
<div class="w-2 h-2 rounded-full bg-primary"></div>
</div>
<span class="text-title-md font-title-md text-error tracking-tight">Security</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface uppercase font-semibold">Active</span>
</label>
</div>
<!-- Operational Clarification Notice -->
<div class="py-space-lg flex flex-col gap-space-xs">
<p class="text-body-sm font-body-sm text-secondary leading-relaxed">
      This sends an SMS to the secretary, the manager, and the guard on duty.
    </p>
<p class="text-label-caps font-label-caps text-secondary">
      Estimated response time: 2–4 mins
    </p>
</div>
<!-- Confirmation Hold & Action Layer -->
<div class="flex flex-col items-center pt-space-lg gap-space-md w-full">
<!-- Single Primary Action Button -->
<button class="w-full h-12 rounded-lg bg-error active:opacity-85 text-surface font-title-md text-title-md tracking-tight flex items-center justify-center transition-opacity" id="emergency-btn" onclick="triggerAlert(this)" type="button">
      Send alert
    </button>
<!-- Secondary Navigation Link -->
<button class="text-body-md font-body-md text-on-surface hover:underline py-space-xs focus:outline-none" onclick="history.back()" type="button">
      Cancel
    </button>
</div>
<!-- Transmission Record Details (Subtle Flat Ledger Verification) -->
<div class="mt-space-xl pt-space-md border-t border-outline-variant flex justify-between items-center text-label-caps font-label-caps text-secondary">
<span>DISPATCH LOG: ID-9081</span>
<span>SOCIETY GATE 1 MONITORED</span>
</div>
</div>
<script>
  function selectEmergency(type) {
    const types = ['medical', 'fire', 'security'];
    types.forEach(t => {
      const radio = document.getElementById('radio-' + t);
      const dot = radio.firstElementChild;
      if (t === type) {
        radio.classList.remove('border-secondary');
        radio.classList.add('border-primary');
        dot.classList.remove('bg-transparent');
        dot.classList.add('bg-primary');
      } else {
        radio.classList.remove('border-primary');
        radio.classList.add('border-secondary');
        dot.classList.remove('bg-primary');
        dot.classList.add('bg-transparent');
      }
    });
  }

  function triggerAlert(btn) {
    btn.disabled = true;
    btn.textContent = 'Transmitting...';
    setTimeout(() => {
      btn.textContent = 'Alert Sent to Desk';
      btn.classList.remove('bg-error');
      btn.classList.add('bg-primary');
    }, 600);
  }
</script></main></body></html>
