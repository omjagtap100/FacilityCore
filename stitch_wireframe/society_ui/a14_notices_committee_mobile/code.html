<!-- Horizontal Category Type Row with Ink Underline -->
<div class="w-full overflow-x-auto no-scrollbar pt-2 bg-surface">
<div class="flex items-center gap-6 px-margin min-w-max border-b border-outline-variant/30">
<button class="relative pb-3 font-label-caps text-label-caps tracking-widest uppercase text-on-surface focus:outline-none transition-colors" onclick="selectCategory(this)">
        Water
        <span class="category-indicator absolute bottom-0 left-0 right-0 h-[2px] bg-primary"></span>
</button>
<button class="relative pb-3 font-label-caps text-label-caps tracking-widest uppercase text-secondary hover:text-on-surface focus:outline-none transition-colors" onclick="selectCategory(this)">
        Tanker
        <span class="category-indicator hidden absolute bottom-0 left-0 right-0 h-[2px] bg-primary"></span>
</button>
<button class="relative pb-3 font-label-caps text-label-caps tracking-widest uppercase text-secondary hover:text-on-surface focus:outline-none transition-colors" onclick="selectCategory(this)">
        Lift
        <span class="category-indicator hidden absolute bottom-0 left-0 right-0 h-[2px] bg-primary"></span>
</button>
<button class="relative pb-3 font-label-caps text-label-caps tracking-widest uppercase text-secondary hover:text-on-surface focus:outline-none transition-colors" onclick="selectCategory(this)">
        Meeting
        <span class="category-indicator hidden absolute bottom-0 left-0 right-0 h-[2px] bg-primary"></span>
</button>
<button class="relative pb-3 font-label-caps text-label-caps tracking-widest uppercase text-secondary hover:text-on-surface focus:outline-none transition-colors" onclick="selectCategory(this)">

        <span class="category-indicator hidden absolute bottom-0 left-0 right-0 h-[2px] bg-primary"></span>
</button>

<!-- Form Composer Section -->
<div class="px-margin pt-6 flex flex-col gap-4">
<!-- Title Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps uppercase text-secondary tracking-wider" for="notice-title">
        Title
      </label>
<input class="w-full h-12 px-4 rounded-lg bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary transition-colors" id="notice-title" type="text" value="Water shutdown"/>
</div>

<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps uppercase text-secondary tracking-wider" for="notice-message">

      </label>
<textarea class="w-full p-4 rounded-lg bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary transition-colors resize-none leading-relaxed" id="notice-message" rows="2">18 March, 10am to 4pm.</textarea>
</div>

<span id="btn-text">Publish</span>

<span class="font-label-caps text-label-caps uppercase font-semibold text-error tracking-wider shrink-0">
          UPCOMING
        </span>
</div>
</div>
</div>
</div>
<script>
  function selectCategory(clickedBtn) {
    const parent = clickedBtn.parentElement;
    const allButtons = parent.querySelectorAll('button');
    allButtons.forEach((btn) => {
      btn.classList.remove('text-on-surface');
      btn.classList.add('text-secondary');
      const ind = btn.querySelector('.category-indicator');
      if (ind) ind.classList.add('hidden');
    });

    clickedBtn.classList.remove('text-secondary');
    clickedBtn.classList.add('text-on-surface');
    const indicator = clickedBtn.querySelector('.category-indicator');
    if (indicator) indicator.classList.remove('hidden');
  }

  function handlePublish() {
    const titleInput = document.getElementById('notice-title');
    const messageInput = document.getElementById('notice-message');
    const btn = document.getElementById('publish-btn');
    const btnText = document.getElementById('btn-text');
    const btnCheck = document.getElementById('btn-check');
    const feed = document.getElementById('notice-feed');

    const titleVal = titleInput.value.trim();
    const msgVal = messageInput.value.trim();

    if (!titleVal) return;

    btnText.classList.add('hidden');
    btnCheck.classList.remove('hidden');

    setTimeout(() => {
      const newRow = document.createElement('div');
      newRow.className = 'py-4 flex items-baseline justify-between transition-colors bg-surface-container/30 px-2 -mx-2 rounded';
      newRow.innerHTML = `
        <div class="flex flex-col pr-4 min-w-0">
          <span class="font-title-md text-title-md text-on-surface truncate">${titleVal}</span>
          <span class="font-body-sm text-body-sm text-secondary mt-0.5">${msgVal}</span>
        </div>
        <span class="font-label-caps text-label-caps uppercase font-semibold text-on-tertiary-container tracking-wider shrink-0">
          ACTIVE
        </span>
      `;
      feed.insertBefore(newRow, feed.firstChild);

      btnText.classList.remove('hidden');
      btnCheck.classList.add('hidden');
      titleInput.value = '';
      messageInput.value = '';
    }, 400);
  }
</script></main></div></body></html>
